[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libresprite-mcp"
version = "0.1.0"
description = "MCP server for driving LibreSprite headlessly to generate and edit pixel art"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.10"
authors = [{ name = "vchopDev" }]
dependencies = [
    "mcp>=2.0.0",
]

[project.scripts]
libresprite-mcp = "libresprite_mcp.server:main"

[project.urls]
Repository = "https://github.com/vchopDev/libresprite-mcp"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/libresprite_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a real LibreSprite binary (set LIBRESPRITE_BIN)",
]
